<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
  <rect width="1400" height="840" fill="#ffffff"/>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;fill:#111}
    .muted{fill:#666}.small{font-size:14px}.label{font-size:12px;font-weight:800;letter-spacing:2px}.title{font-size:28px;font-weight:800}.body{font-size:16px}.meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#777}
    .card{fill:#fff;stroke:#111;stroke-width:2}.line{fill:none;stroke:#9da59f;stroke-width:2}.line.focus{stroke:#d7874d;stroke-width:4}.ready{fill:#a6aaa5}.progress{fill:#d7874d}.verified{fill:#5a927f}.needs{fill:#c96766}
  </style>
  <line x1="40" y1="104" x2="1360" y2="104" stroke="#111" stroke-width="2"/>
