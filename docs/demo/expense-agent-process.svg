    <circle cx="153" cy="8" r="7" class="progress"/><text x="168" y="14" class="small muted">进行中</text>
    <path d="M260 8h36" class="line"/><path d="M292 3l8 5-8 5" fill="none" stroke="#9da59f" stroke-width="2"/>
    <circle cx="318" cy="8" r="7" class="needs"/><text x="333" y="14" class="small muted">待确认</text>
    <path d="M425 8h36" class="line"/><path d="M457 3l8 5-8 5" fill="none" stroke="#9da59f" stroke-width="2"/>
    <circle cx="483" cy="8" r="7" class="verified"/><text x="498" y="14" class="small muted">已验证</text>
  </g>
  <g>
    <path d="M320 430C410 350 440 270 500 230" class="line"/>
    <path d="M320 430C410 430 445 430 500 430" class="line focus"/>
    <path d="M320 430C410 510 445 590 500 630" class="line"/>
    <path d="M820 430C900 430 930 430 1000 430" class="line focus"/>
    <path d="M820 630C900 630 930 630 1000 630" class="line"/>
    <path d="M1190 250C1260 250 1260 430 1190 430" class="line"/>
    <path d="M1190 430C1260 430 1260 630 1190 630" class="line"/>
